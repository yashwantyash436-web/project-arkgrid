services:
  - type: web
    name: arkgrid-api
    runtime: python
    plan: free
    rootDir: services/api
    buildCommand: |
      python -m pip install --upgrade pip
      pip install -e .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    disk:
      name: arkgrid-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: sqlite:////data/arkgrid.sqlite3
      - key: ARKGRID_ALLOWED_ORIGINS
        value: https://arkgrid-web.onrender.com
      - key: ARKGRID_COORDINATOR_TOKEN
        generateValue: true
      - key: ARKGRID_ENV
        value: production
      - key: ARKGRID_LOG_LEVEL
        value: info

  - type: static
    name: arkgrid-web
    rootDir: apps/web
    buildCommand: |
      corepack enable
      pnpm install --frozen-lockfile
      pnpm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_ARKGRID_API_URL
        value: https://arkgrid-api.onrender.com
